
name: Create five bug issues

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = [
              ["Błąd w warunku count", "Brakuje operatora porównania w warunku sprawdzającym wartość count."],
              ["Błąd inicjalizacji Random", "Obiekt Random nie został poprawnie utworzony."],
              ["Brak instrukcji return", "Metoda InitializeDisplayBoard nie zwraca tablicy displayBoard."],
              ["Błąd w warunku pętli", "Brakuje wywołania Math.Min w warunku pętli."],
              ["Brak zmiennej width", "W warunku sprawdzającym zwycięstwo brakuje zmiennej width."]
            ];

            const result = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });

            for (const [title, description] of issues) {
              const exists = result.data.some(issue => issue.title === title);
              if (!exists) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: description
                });
              }
            }
