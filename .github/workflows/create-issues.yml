<CodeBlock language="yaml" editable>
name: Create five bug issues

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
create-issues:
runs-on: ubuntu-latest
steps:
- name: Create issues
uses: actions/github-script@v7
with:
script: |
const issues = [
{
title: "Błąd w warunku count",
body: "Znaleziono błąd w warunku if. Niepoprawny kod: if (count /??/ 0). Brakuje operatora porównania. Rozwiązanie: if (count == 0). Należy dodać zrzut ekranu błędu."
},
{
title: "Brak inicjalizacji obiektu Random",
body: "Znaleziono brak inicjalizacji obiektu Random. Niepoprawny kod: Random random = /??/. Rozwiązanie: Random random = new Random(). Należy dodać zrzut ekranu błędu."
},
{
title: "Brak instrukcji return w InitializeDisplayBoard",
body: "W metodzie InitializeDisplayBoard brakuje instrukcji zwracającej tablicę displayBoard. Rozwiązanie: return displayBoard;. Należy dodać zrzut ekranu błędu."
},
{
title: "Niekompletne wywołanie Math.Min",
body: "W metodzie CountAdjacentBombs znaleziono niekompletne wywołanie Math.Min. Rozwiązanie: j <= Math.Min(width - 1, x + 1). Należy dodać zrzut ekranu błędu."
},
{
title: "Błąd w warunku CheckWin",
body: "W metodzie CheckWin brakuje zmiennej width. Rozwiązanie: return uncoveredCount == width * height - bombCount;. Należy dodać zrzut ekranu błędu."
}
];

for (const issue of issues) {
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                per_page: 100
              });

if (!existing.data.some(item => item.title === issue.title)) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body
                });
              }
            }
</CodeBlock>
